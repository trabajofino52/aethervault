# ============================================================================
# AetherVault - Hardened Nginx Reverse Proxy Configuration (Debian 13 Trixie)
# Ruta destino: /etc/nginx/sites-available/aethervault.conf
# ============================================================================

# Zonas de limitación anti-DDoS y anti-fuerza bruta por IP
limit_req_zone $binary_remote_addr zone=av_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=av_auth_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=av_conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com _;

    # Desactivar firma de versión de Nginx
    server_tokens off;

    # Tamaño máximo de petición (evita ataques de agotamiento de memoria)
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Límite de conexiones simultáneas por IP
    limit_conn av_conn_limit 25;

    # Cabeceras de Seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Activar HSTS cuando Certbot habilite el bloque listen 443 ssl:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Bloquear acceso a archivos ocultos (.env, .git, data/, backups)
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* \.(db|db-wal|db-shm|sqlite|sql|bak|env|key)$ {
        deny all;
        return 404;
    }

    # Protección estricta para autenticación y cambio de contraseña
    location ~ ^/api/auth/(login|change-password) {
        limit_req zone=av_auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Limitación estándar para endpoints API
    location /api/ {
        limit_req zone=av_api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Aplicación React / Vite / Express en puerto interno 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
